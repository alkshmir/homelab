# see https://github.com/LibreChat-AI/LibreChat/blob/chart-3.2.1/helm/librechat/values.yaml

global:
  librechat:
    existingSecretName: "librechat-credentials-env"

librechat:
  configEnv:
    PLUGIN_MODELS: gpt-4,gpt-4-turbo-preview,gpt-4-0125-preview,gpt-4-1106-preview,gpt-4-0613,gpt-3.5-turbo,gpt-3.5-turbo-0125,gpt-3.5-turbo-1106,gpt-3.5-turbo-0613
    ALLOW_REGISTRATION: "true"
    SESSION_EXPIRY: "3600000" # 1 hour

  # Volume used to store image Files uploaded to the Web UI
  imageVolume:
    enabled: true
    size: 8G
    accessModes: ReadWriteOnce
    storageClassName: longhorn

updateStrategy:
  type: Recreate

imagePullSecrets: []

service:
  type: ClusterIP
  port: 3080

ingress:
  enabled: false
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: librechat.homelab.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chat.example.com

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

# MongoDB Parameters
mongodb:
  image:
    # if you want to deploy mongo to arm64 node, overwrite image to suppport arm64
    # see https://github.com/bitnami/charts/issues/3635#issuecomment-2628385764
    # repository: dlavrenuek/bitnami-mongodb-arm
    tag: 7.0.15
  nodeSelector:
    # force scheduling to amd64 node
    kubernetes.io/arch: amd64
  updateStrategy:
    type: Recreate
  enabled: true
  auth:
    enabled: false
  databases:
    - LibreChat
#  persistence:
#    size: 8Gi

meilisearch:
  enabled: true
  persistence:
    enabled: true
    storageClass: longhorn
    size: 8Gi
  auth:
    # Use an existing Kubernetes secret for the MEILI_MASTER_KEY
    existingMasterKeySecret: "librechat-credentials-env"
