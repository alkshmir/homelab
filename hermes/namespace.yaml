apiVersion: v1
kind: Namespace
metadata:
  name: hermes
  labels:
    # Reject privileged pods, hostNetwork, hostPID, hostPath, etc.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: hermes
# Prevent pods in this namespace from accessing the Kubernetes API token.
automountServiceAccountToken: false
