apiVersion: v1
kind: ResourceQuota
metadata:
  name: hermes-quota
  namespace: hermes
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: "2Gi"
    limits.cpu: "3"
    limits.memory: "3Gi"
    persistentvolumeclaims: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: hermes-limits
  namespace: hermes
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: "2Gi"
      defaultRequest:
        cpu: "250m"
        memory: "512Mi"
