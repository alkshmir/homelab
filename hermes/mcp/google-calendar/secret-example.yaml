apiVersion: v1
kind: Secret
metadata:
  name: google-calendar-oauth
  namespace: hermes-mcp
type: Opaque
stringData:
  # Paste the contents of your downloaded gcp-oauth.keys.json
  # (Google Cloud Console -> Credentials -> OAuth 2.0 Client ID -> Desktop app).
  # Service Account JSON is also supported by @cocal/google-calendar-mcp.
  gcp-oauth.keys.json: |
    {
      "installed": {
        "client_id": "<CLIENT_ID>.apps.googleusercontent.com",
        "project_id": "<PROJECT_ID>",
        "auth_uri": "https://accounts.google.com/o/oauth2/auth",
        "token_uri": "https://oauth2.googleapis.com/token",
        "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
        "client_secret": "<CLIENT_SECRET>",
        "redirect_uris": ["http://localhost"]
      }
    }
