apiVersion: v1
kind: Secret
metadata:
  name: hermes-credentials
  namespace: hermes
type: Opaque
stringData:
  # Google Gemini / AI Studio (Hermes accepts either GEMINI_API_KEY or GOOGLE_API_KEY)
  GEMINI_API_KEY: <GEMINI_API_KEY>
  # GOOGLE_API_KEY: <GOOGLE_API_KEY>
  # Other LLM providers — uncomment what you use
  # OPENROUTER_API_KEY: <OPENROUTER_API_KEY>
  # OPENAI_API_KEY: <OPENAI_API_KEY>
  # ANTHROPIC_API_KEY: <ANTHROPIC_API_KEY>
  # Optional messaging / gateway tokens
  # TELEGRAM_BOT_TOKEN: <TELEGRAM_BOT_TOKEN>
  # DISCORD_BOT_TOKEN: <DISCORD_BOT_TOKEN>
  # Optional OpenAI-compatible API server auth key (required if API_SERVER_HOST=0.0.0.0)
  # API_SERVER_KEY: <API_SERVER_KEY>
