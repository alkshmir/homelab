service:
  type: ClusterIP

ingress:
  enabled: false

httproute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - zot.homelab.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 600s
        backendRequest: 600s

persistence: true
pvc:
  storage: 5Gi

mountConfig: true
configFiles:
  config.json: |-
    {
      "storage": {
        "rootDirectory": "/var/lib/registry"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "readTimeout": "60s",
        "writeTimeout": "60s"
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "search": { "enable": true },
        "ui": { "enable": true }
      }
    }
